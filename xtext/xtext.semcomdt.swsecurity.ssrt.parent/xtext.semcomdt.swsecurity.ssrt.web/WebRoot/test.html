<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta http-equiv="Content-Language" content="en-us">
	<title>Xtext-Web Domainmodel Example</title>
	<link rel="stylesheet" type="text/css" href="xtext/2.35.0/xtext-ace.css" />
	<link rel="stylesheet" type="text/css" href="style.css" />
	<script src="webjars/requirejs/2.3.6/require.min.js"></script>
	<script type="text/javascript">
		var baseUrl = window.location.pathname;
		var fileIndex = baseUrl.indexOf("test.html");
		if (fileIndex > 0)
			baseUrl = baseUrl.slice(0, fileIndex)
		require.config({
			baseUrl: baseUrl,
			paths: {
				"jquery": "webjars/jquery/3.6.0/jquery.min",
				"ace/ext/language_tools": "webjars/ace/1.3.3/src/ext-language_tools",
				"xtext/xtext-ace": "xtext/2.35.0/xtext-ace",
			}
		});
		require(["webjars/ace/1.3.3/src/ace"], function() {
			require(["xtext/xtext-ace"], function(xtext) {
				var editors = xtext.createEditor({
									position: "absolute",
									syntaxDefinition: "xtext-resources/generated/mode-ssrt",
									enableFormattingAction: true,
									baseUrl: baseUrl,
								});
								var leftServices = editors[0].xtextServices;
								var rightServices = editors[1].xtextServices;
								leftServices.editorContext.addServerStateListener(function(params) {
									if (!params.forceUpdate)
										rightServices.update({forceUpdate: true});
								});
								rightServices.editorContext.addServerStateListener(function(params) {
									if (!params.forceUpdate)
										leftServices.update({forceUpdate: true});
								});
							
			});
		});
	</script>
</head>
<body>

	<div class="container-left">
		<div class="xtext-editor"
			data-editor-resource-id="scada_authentication.ssrt">
		</div>
	</div>
	<div class="container-right">
		<div class="xtext-editor"
			data-editor-resource-id="scada_authorization.ssrt">
		</div>
	</div>

</body>
</html>
